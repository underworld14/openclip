# electron-builder.yml — OpenClip Desktop packaging (P7 / PRD §13, §15; plan E.6)
#
# macOS Apple-Silicon-first arm64 dmg. The three native sidecars are bundled as
# `extraResources` and resolved at runtime by src/main/utils/paths.ts:
#   resources/ffmpeg  → <Resources>/ffmpeg/<plat-arch>/{ffmpeg,ffprobe}
#   resources/whisper → <Resources>/whisper/<plat-arch>/whisper-cli
#   resources/yt-dlp  → <Resources>/yt-dlp/<plat-arch>/yt-dlp   (URL/YouTube import, F.4)
#   build/fonts       → <Resources>/fonts/DejaVuSans.ttf   (libass fontsdir)
#   build/onnx        → <Resources>/onnx/   (YuNet model + onnxruntime-web wasm — auto-reframe, Part J)
# These directories are populated by scripts/bundle-binaries.mjs (run in the
# `beforePack` hook below) so the bundle is reproducible and not committed.
#
# Signing/notarization: hardenedRuntime + entitlements always; the afterSign
# hook (build/notarize.cjs) notarizes ONLY when Apple credentials are present in
# the environment, otherwise it logs "skipping" and returns so dev/unsigned
# builds still complete (PRD §15).
appId: com.openclip.desktop
productName: OpenClip
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.shared.json,tsconfig.test.json}'
  - '!{vitest.config.ts,playwright.config.ts,components.json}'
  - '!{tests,scripts,test-results,playwright-report,.smoke-cache}/**'
  # Repo/agent metadata is not product. All of this was shipping inside app.asar
  # (FEAT-d8b6bj): the Pine issue tracker with every ticket and learning, four
  # agent-harness config dirs, the internal PRD/design docs, and stale
  # tsbuildinfo. Besides being ~550 KB of noise in a user-facing bundle, it is
  # internal project history handed to anyone who opens the app — and it broke
  # `verify:package`, because a ticket QUOTING `--enable-nonfree` tripped the
  # byte-scan guardrail meant to catch a real nonfree ffmpeg in the bundle.
  - '!{.pine,.claude,.codex,.cursor,.agents,.husky}/**'
  - '!docs/**'
  - '!*.tsbuildinfo'
  - '!build/**'
  # No markdown inside app.asar. The user-facing licence documents ship under
  # `extraResources` below (where licence files belong, next to the binaries they
  # describe) rather than being buried in the code archive — and keeping prose out
  # of the asar stops documentation that merely *discusses* `--enable-nonfree`
  # from tripping verify-package's byte-scan for a real nonfree ffmpeg binary.
  - '!*.md'
  # Dead weight inside app.asar (BUG-t1xj4d). onnxruntime-web ships every wasm
  # build variant (~74 MB) plus sourcemaps (~21 MB), and NONE of them are read at
  # runtime: `reframe-detect.ts` sets `ort.env.wasm.wasmPaths` to
  # `reframeWasmDir()` → `<Resources>/onnx`, the separate 13 MB copy staged by
  # bundle-binaries.mjs. Users were downloading ~95 MB of files the app never
  # opens, on every install and every update. The JS entry graph
  # (`dist/ort.node.min.js`, the package `main`) is deliberately kept.
  - '!node_modules/onnxruntime-web/dist/**/*.map'
  - '!node_modules/onnxruntime-web/dist/*.wasm'
  - '!node_modules/onnxruntime-web/docs/**'
  # lucide-react is compiled INTO the renderer chunk by vite, so its node_modules
  # copy (~39 MB of per-icon modules) is dead in the packaged app too.
  - '!node_modules/lucide-react/**'
# Populate resources/{ffmpeg,whisper}/<plat-arch> from node_modules / the whisper
# build output before the app is packed (keeps large binaries out of git — plan E.6).
beforePack: build/bundle-binaries.cjs
# afterSign notarize hook — gated on env creds (see build/notarize.cjs).
afterSign: build/notarize.cjs
# Bundled sidecars + native addons must NOT live inside app.asar (they have to be
# spawnable / dlopen-able from disk) — PRD §13, §8.4.
asarUnpack:
  - resources/**
  - '**/*.node'
# Native binaries shipped beside the app and resolved via process.resourcesPath.
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'
  - from: resources/whisper
    to: whisper
    filter:
      - '**/*'
  - from: resources/yt-dlp
    to: yt-dlp
    filter:
      - '**/*'
  - from: build/fonts
    to: fonts
    # Ship the fonts AND their license (OFL.txt / LICENSE*) so the redistribution
    # terms travel with the .ttf files (supply-chain guardrail — openclip-hk7).
    # verify-package.mjs asserts a license file is present under Resources/fonts.
    filter:
      - '**/*.ttf'
      - '**/OFL.txt'
      - '**/LICENSE*'
  # Auto-reframe (Part J): the YuNet model + the onnxruntime-web WASM/loader that
  # scripts/bundle-binaries.mjs stages into build/onnx. Resolved in prod by
  # src/main/utils/paths.ts → reframeOnnxDir() as <Resources>/onnx (and used as
  # ort.env.wasm.wasmPaths so the .wasm loads beside the model).
  - from: build/onnx
    to: onnx
    filter:
      - '**/*.onnx'
      - '**/*.wasm'
      - '**/*.mjs'
  # The app's own licence and the third-party inventory (FEAT-d8b6bj). A user who
  # opens the bundle should be able to find out what they actually received and
  # under which terms — the app is MIT but ships GPL-3.0-or-later FFmpeg, whose
  # licence text and written offer live at ffmpeg/<plat-arch>/.
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-LICENSES.md
    to: THIRD-PARTY-LICENSES.md
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The custom afterSign hook performs notarization conditionally; disable the
  # built-in path so an unsigned dev build is not forced to notarize.
  notarize: false
  extendInfo:
    - NSMicrophoneUsageDescription: OpenClip does not record audio; this is declared only because bundled media tooling links AVFoundation.
    - NSDocumentsFolderUsageDescription: OpenClip reads and writes video projects you choose.
    - NSDownloadsFolderUsageDescription: OpenClip exports finished clips to folders you choose.
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
# Electron fuses (BUG-hqbett): the app never re-execs itself as plain Node
# (every sidecar is spawned as its OWN standalone binary — ffmpeg/whisper-cli/
# yt-dlp, never `child_process.fork()` of the Electron binary), so there is no
# legitimate use for these in the shipped app; leaving them at their permissive
# defaults only widens what a local attacker (or a compromised dependency) can
# do to the packaged .app.
#   runAsNode: false                      — ELECTRON_RUN_AS_NODE can no longer
#     turn the packaged binary into an arbitrary Node interpreter.
#   enableNodeCliInspectArguments: false  — --inspect/--inspect-brk can no
#     longer attach a debugger (and read process memory) to the shipped app.
#   onlyLoadAppFromAsar: true             — code can only load from app.asar,
#     not a same-named `app`/`default_app.asar` planted beside it.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
# `publish:` — GitHub Releases is the real feed (EPIC-k83ghw / FEAT-azvb5c):
# electron-updater is wired (FEAT-x9femg) and the repo now has a public
# Releases page to check against. This block's job is `app-update.yml` (which
# electron-builder writes into the package at pack time REGARDLESS of whether
# a publish is actually requested) so `checkForUpdate()` has a real feed to
# read. It does NOT itself upload anything: a plain `npm run build:mac*`
# never passes `--publish`, and no GH_TOKEN/GITHUB_TOKEN is set in this repo's
# normal dev/build environment, so electron-builder has neither the intent
# nor the credential to publish on its own — creating a GitHub Release stays
# an explicit `gh release create` (or CI job) step, never a build side effect.
publish:
  provider: github
  owner: underworld14
  repo: openclip
