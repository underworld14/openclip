<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OpenClip</title>
    <!--
      No <meta http-equiv="Content-Security-Policy"> here ON PURPOSE (F.5).
      The CSP is the single source of truth in the response header installed by
      installCsp()/cspHeader() in src/main/index.ts. A page-level <meta> CSP
      INTERSECTS with the header CSP, and an out-of-date meta tag (missing
      media-src blob:/file: + connect-src https:) blocked the module script /
      media in the PACKAGED build → blank white window. Keep CSP header-only.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
